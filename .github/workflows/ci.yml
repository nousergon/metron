# PR gate — the 406-test backend suite, lint, and the web typecheck/tests run on
# every PR and push to main (metron-ops#25: deploy.yml alone meant the suite ran
# only on developer discipline). Coverage floor pinned at 95% so the measured 97%
# can't silently erode.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


permissions: {}
jobs:
  python:
    name: pytest + ruff (api, portfolio_analytics)
    # GitHub-hosted ubuntu-latest: this is a PUBLIC repo, so GHA-hosted runners are
    # free/unlimited (0 billable minutes). Self-hosting a public repo only adds paid
    # compute + a fork-PR self-hosted-runner security exposure and saves nothing —
    # cost-I2864.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff
      - name: Ruff
        run: ruff check api portfolio_analytics tests
      - name: Pytest (coverage floor 95%)
        run: pytest tests/ -q --cov=api --cov=portfolio_analytics --cov-fail-under=95

  postgres:
    name: pytest on Postgres (dialect parity gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: metron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" alembic
      - name: Run Alembic migrations against Postgres
        env:
          DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/metron_test
        run: alembic upgrade head
      - name: Pytest against Postgres
        env:
          DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/metron_test
        run: pytest tests/ -q

  web:
    name: tsc + lint + vitest (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx next lint
      - name: Vitest
        run: npm test
