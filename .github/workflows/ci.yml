# PR gate — the 406-test backend suite, lint, and the web typecheck/tests run on
# every PR and push to main (metron-ops#25: deploy.yml alone meant the suite ran
# only on developer discipline). Coverage floor pinned at 95% so the measured 97%
# can't silently erode.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


permissions: {}
jobs:
  python:
    name: pytest + ruff (api, portfolio_analytics)
    # GitHub-hosted ubuntu-latest: this is a PUBLIC repo, so GHA-hosted runners are
    # free/unlimited (0 billable minutes). Self-hosting a public repo only adds paid
    # compute + a fork-PR self-hosted-runner security exposure and saves nothing —
    # cost-I2864.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The badge-publish step below writes `coverage.json` on the orphan
    # `badges` branch through the contents API. Nothing else in this job
    # writes, and the token is scoped no wider than that.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff
      - name: Ruff
        run: ruff check api portfolio_analytics tests

      # Strict typing, BLOCKING (alpha-engine-config-I12607). Errors recorded in
      # `.basedpyright/baseline.json` are tolerated; any new one fails. On a PR the
      # baseline may only shrink: a count that grew for any (file, rule) pair means the baseline was
      # regenerated to absorb new errors, which is refused.
      # Missing RETURN annotations are not a pyright rule, so ruff's ANN rules run
      # over every source file the PR adds or changes: touch a file, annotate it.
      - name: Type check (basedpyright strict, baseline may only shrink)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          basedpyright --pythonpath "$(command -v python)"
          if ! git diff --quiet -- .basedpyright/baseline.json; then
            echo "::warning::type errors were fixed but .basedpyright/baseline.json was not shrunk; run basedpyright locally and commit the smaller baseline."
            git checkout -- .basedpyright/baseline.json
          fi
          if [ -n "${BASE_REF}" ]; then
            fetched=0
            for attempt in 1 2 3; do
              if git fetch --quiet --depth=1 origin "${BASE_REF}"; then fetched=1; break; fi
              sleep 5
            done
            if [ "${fetched}" -ne 1 ]; then
              echo "::error::could not fetch the PR base ${BASE_REF} after 3 tries; the shrink-only baseline check cannot run, so this step fails."
              exit 1
            fi
            mapfile -t changed < <(git diff --name-only --diff-filter=AMR FETCH_HEAD HEAD -- 'api/*.py' 'portfolio_analytics/*.py' 'scripts/*.py')
            if [ "${#changed[@]}" -gt 0 ]; then
              ruff check --select ANN --ignore ANN401 "${changed[@]}"
            fi
            if git cat-file -e "FETCH_HEAD:.basedpyright/baseline.json" 2>/dev/null; then
              git show "FETCH_HEAD:.basedpyright/baseline.json" > /tmp/baseline-base.json
              git show "HEAD:.basedpyright/baseline.json" > /tmp/baseline-head.json 2>/dev/null \
                || echo '{"files": {}}' > /tmp/baseline-head.json
              python3 - <<'PY'
          import collections, json, sys
          def counts(path):
              files = json.load(open(path))["files"]
              return collections.Counter((f, e["code"]) for f, es in files.items() for e in es)
          base, head = counts("/tmp/baseline-base.json"), counts("/tmp/baseline-head.json")
          grown = {k: (base[k], n) for k, n in head.items() if n > base[k]}
          for (path, code), (b, n) in sorted(grown.items()):
              print(f"::error::type baseline grew for {code} in {path}: {b} -> {n}. Fix the new errors instead of re-baselining.")
          sys.exit(1 if grown else 0)
          PY
            fi
          fi
      - name: Pytest (coverage floor 95%)
        run: pytest tests/ -q --cov=api --cov=portfolio_analytics --cov-fail-under=95

      # repository-baseline-policy.md §5.1 — a badge whose value is written by
      # a human is forbidden: it renders identically to a real one and becomes
      # false the moment reality moves without anyone editing a file. This
      # repo carried no coverage badge at all, which the sweep treats the same
      # way (Tier A must carry one, §5.3). The README badge now renders
      # whatever this step last published, derived from the same `.coverage`
      # file the coverage-floor gate above reads.
      #
      # Pushes to main only: a pull-request run measures a tree that is not
      # yet what a reader of the README is looking at.
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_coverage_badge.sh

  postgres:
    name: pytest on Postgres (dialect parity gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: metron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" alembic
      - name: Run Alembic migrations against Postgres
        env:
          DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/metron_test
        run: alembic upgrade head
      - name: Pytest against Postgres
        env:
          DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/metron_test
        run: pytest tests/ -q

  web:
    name: tsc + lint + vitest (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx next lint
      - name: Vitest
        run: npm test

  # Rejects any dependency extra written with an underscore. pip <23.3 does not
  # normalise `_` to `-` in a REQUESTED extra while setuptools always normalises
  # the DECLARED one, so `pkg[flow_doctor]` matches nothing against
  # `Provides-Extra: flow-doctor` — and pip reports that as a WARNING on a
  # SUCCESSFUL exit. Measured 2026-08-12: pip 23.2.1 resolves 18 packages with
  # flow-doctor absent, 23.3.2/24.0/25.0 resolve 30 with it present. Amazon
  # Linux 2023 ships pip 23.2.1, which is how it reached production
  # (alpha-engine-config-I6963).
  #
  # This is a STATIC check on purpose. Every resolve job in this fleet upgrades
  # pip before resolving, so CI runs on a pip that normalises correctly and can
  # never reproduce the production resolver. A green resolve is not evidence.
  lint-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Lint dependency extras (no underscores)
        run: python3 scripts/lint_extras.py .
