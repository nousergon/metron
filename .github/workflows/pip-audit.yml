name: pip-audit

# Blocking dependency-vulnerability gate on metron's own declared deps.
# alpha-engine-config#2530 (fleet pip-audit standardization).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 14:00 UTC — CVE feeds publish on a rolling cadence; daily
    # is the smallest cadence that's actually useful (mirrors mnemon's
    # pip-audit.yml and nousergon-lib's/krepis's/vires's/telos's, all
    # config#2530).
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit declared dependencies
        # `pip-audit . --strict` audits only the deps declared in
        # pyproject.toml's base `dependencies`. Any vulnerability in a
        # runtime dep fails the workflow; add `--ignore-vuln <ID>` here
        # with a reason comment if a transitive dep has no fix release
        # available.
        # PYSEC-2026-2447 (diskcache 5.6.3): diskcache defaults to pickle
        # serialization (RCE if attacker can write to the cache directory).
        # No fixed version exists (5.6.3 is latest). The cache is intra-
        # server only (gunicorn workers on the same machine) and the cache
        # directory is system-temp with restricted permissions — an attacker
        # who can write there already owns the box. (metron-ops#234)
        run: pip-audit --strict . --ignore-vuln PYSEC-2026-2447
