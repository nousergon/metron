# Metron — public, multi-tenant portfolio-analytics SaaS. Nous Ergon product at
# metron.nousergon.ai. "Portfolio analytics, measured." AGPL-3.0 (self-hostable;
# the hosted service + proprietary data feeds are the commercial moat). No AI, no
# ads/trackers, no advice, read-only.
#
# One codebase, two top-level packages:
#   portfolio_analytics/  — the pure engine (domain math + broker ingestion), built
#                           on the published quant core in nousergon-lib[quant].
#   api/                  — FastAPI service + multi-tenant Postgres schema over it.
# (Next.js/Tremor web/ lands in PH2.) Dev on SQLite = $0; prod on Postgres.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metron"
version = "0.0.1"
description = "Metron — multi-tenant portfolio-analytics SaaS. Engine + FastAPI backend. No AI, no ads, no advice, read-only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    # --- web/API tier ---
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.51.0",
    # Process manager wrapping uvicorn workers (systemd ExecStart). Declared here
    # so no dependency-sync operation can strip it from the prod venv (metron-I333).
    "gunicorn>=26.0.0",
    # Cross-process compute cache backend (metron-ops#234) — diskcache uses SQLite with
    # file-level locking so multiple workers share a single cache store and single-flight
    # lock. Replaces the original in-process ``dict`` + ``threading.Lock``.
    "diskcache>=5.6.3",
    # Multipart parsing for CSV/OFX file uploads (FastAPI UploadFile requires it).
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    # Verifies the shared nousergon-auth identity service's EdDSA/Ed25519 JWTs against
    # its JWKS (metron-ops#179) — [crypto] pulls in `cryptography` for the Ed25519 path.
    "pyjwt[crypto]>=2.13.0",
    # --- engine tier (portfolio_analytics/) ---
    "pandas>=3.0.5",
    "numpy>=2.4.6",
    # Quant core (factor risk, attribution, returns, VaR/CVaR, riskstats) + the shared
    # cost-telemetry & SFT-capture chokepoints (nousergon_lib.sft). AGPL-3.0 (the internal
    # NE dedup lib, relicensed from MIT at 0.60.0) — fine here, metron core is AGPL too.
    # Renamed alpha-engine-lib → nousergon-lib at 0.60.0; old `alpha_engine_lib.*` imports
    # still resolve via the in-package shim. Imported from PyPI, not vendored.
    # [quant-stats] added at 0.110.0 for quant.stats.dsr.compute_psr (PSR in the
    # portfolio performance risk basket, metron-ops#190) — needs the >=0.110.0 floor
    # specifically because compute_psr only gained its periods_per_year param there
    # (nousergon-lib#193); Metron's NAV-snapshot cadence is irregular per-user-refresh,
    # not daily, so the pre-0.110.0 hardcoded-252 PSR would silently mis-annualize.
    "nousergon-lib[quant,quant-stats]>=0.124.78",
    # flow-doctor pipeline error-handler via krepis (MIT). krepis owns the
    # logging+flow-doctor glue; metron is AGPL but pulls the MIT commodity
    # layer from krepis and only the AGPL quant core from nousergon-lib.
    "krepis[flow-doctor]>=0.59.18",
    # Thin SnapTrade REST client used by portfolio_analytics.broker_io.snaptrade_reader
    # (imported at module load; tests stub the client but the import still runs).
    # PINNED BELOW 12 — the 12.x line does NOT sign requests for this deploy's key.
    # Measured on the box 2026-08-03 against the SAME credentials: 11.0.213 returns 6
    # linked accounts; 12.0.3 AND 12.0.4 both return `401 {'detail': 'Authentication
    # credentials were not provided.'}` with `WWW-Authenticate: Signature realm="api"`,
    # in every documented v12 auth mode (bare kwargs, SnapTradeAuth.personal_api_key,
    # SnapTradeAuth.commercial_api_key). v12 moved signing behind an explicit `auth=`
    # mode and none of them produce an accepted signature here.
    # Consequence of the unbounded floor: SnapTrade position sync died silently on
    # 2026-07-26 when pip resolved 12.0.1, and the Dependabot major bump (#354, merged
    # 2026-07-28) codified it — the Fidelity/E*Trade/401(k) sleeves froze at
    # broker_as_of 2026-07-25 for 9 days. CI stayed green because every test stubs the
    # client, so the bump's only real exercise was production (metron-ops#260).
    # The upper bound is what makes a future ceiling-raising Dependabot PR visible;
    # tests/test_snaptrade_sdk_pin.py fails if it is removed or the major moves.
    "snaptrade-python-sdk>=11.0.213,<12",
    # OFX/QFX parsing (spec-strict) for the free-tier OFX import path.
    "ofxtools>=1.1.1",
    # S3 client for the data spine. `alpha-engine-data` is the single market/reference-
    # data ground truth for the Nous Ergon system; Metron publishes its held-ticker
    # universe and reads EOD closes / FX / sectors / earnings from its S3 artifacts —
    # it makes NO direct market-data API calls (no yfinance). Remaining external fetch:
    # FRED (Macro page) — a separate spine cutover (the producer already emits macro).
    # INTEGRATION-ONLY (see [tool.metron.dependency-exposure]): every test stubs boto3
    # via conftest's autouse `_no_live_aws_calls`, so no test exercises a real S3 call.
    # `<2` is close to free — boto3 has been on 1.x for its entire life — and it means a
    # major cannot arrive on a routine deploy the way snaptrade 12.x did (metron-ops#260).
    "boto3>=1.43.70,<2",
    # Postgres driver (prod). SQLite is a dev/test fallback and needs nothing extra.
    "psycopg[binary]>=3.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",            # FastAPI TestClient
    # Validates the realized-lots export against the pinned telos contract schema in CI
    # (tests/test_realized_lots_export_contract.py) so the export can't silently drift from
    # nousergon/telos realized_lots v1.0.0 — metron-ops#127.
    "jsonschema>=4.26.0",
    # Property-based testing for the dashboard-accuracy verification framework's layer 4
    # (golden portfolios + property tests, metron-ops#210): generates randomized-but-valid
    # transaction histories to assert ledger invariants hold universally, not just on
    # hand-picked fixtures (tests/test_golden_portfolios.py).
    "hypothesis>=6.165.5",
    "alembic>=1.19.1",            # Postgres schema migrations
    # tests/test_dependency_exposure.py parses .github/dependabot.yml. PyYAML is already
    # present transitively (krepis, nousergon-lib), but a test that imports it must not
    # depend on someone else's dependency tree staying the way it is today.
    "pyyaml>=6.0.3",
]

[tool.metron.dependency-exposure]
# Dependencies whose REAL behaviour no test exercises (metron-ops#265).
#
# The distinction that matters is not "is it a network client" but "if this package
# changed how it talks to its third party, would anything in CI notice?" For these two the
# answer is no: every test stubs them, deliberately and correctly — hermetic tests must not
# depend on live credentials. The consequence is that a version bump's only real exercise
# is production, which is exactly how snaptrade-python-sdk 12.x reached the box and killed
# position sync for nine days on a green Dependabot merge (metron-ops#260).
#
# Being on this list carries two obligations, both enforced by
# tests/test_dependency_exposure.py:
#   1. an upper version bound in [project].dependencies, so a major cannot arrive on a
#      routine `pip install -e .` during a deploy;
#   2. a `version-update:semver-major` ignore in .github/dependabot.yml, so the bump is
#      never proposed for the standing Dependabot auto-merge to carry through on a green
#      CI run that cannot evaluate it.
#
# Deliberately NOT on this list, with the reason, so the next reader does not re-litigate:
#   ofxtools      — tests/test_ofx_import.py parses real OFX text through parse_ofx.
#   psycopg       — the "pytest on Postgres (dialect parity gate)" job runs a real server.
#   krepis        — trading_calendar and logging run for real in the suite. Only
#                   krepis.alerts is stubbed, which is one surface, not the package.
#   nousergon-lib — the quant functions are exercised directly.
# Add a name here the moment its real behaviour stops being exercised anywhere.
integration-only = [
    "snaptrade-python-sdk",
    "boto3",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "portfolio_analytics"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "C408"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are designed to be called in argument
# defaults — whitelist them so B008 doesn't fight the framework's idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.File"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["portfolio_analytics", "api"]
omit = [
    "*/__init__.py",
    # Thin SnapTrade REST client — exercised live, not in units.
    "portfolio_analytics/broker_io/snaptrade_reader.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
