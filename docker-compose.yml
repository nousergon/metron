# Local Postgres for dev parity with production (metron-ops#17 Stage 1).
# Start:  docker compose up -d
# Stop:   docker compose down
# Wipe:   docker compose down -v
#
# SQLite fallback (no Docker needed):
#   DATABASE_URL=sqlite:///./dev.sqlite uvicorn api.main:app

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: metron
      POSTGRES_DB: metron
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
